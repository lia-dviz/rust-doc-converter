[package]
name = "doc_converter_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "doc_converter_core"
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"
